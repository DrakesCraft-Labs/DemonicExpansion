# CI propia de DrakesCraft.
#
# La heredada del upstream compilaba con Java 17 y venia acompanada de un bot que sincronizaba
# solo desde el repositorio original, ademas de CODEOWNERS y FUNDING apuntando a sus autores.
# Nada de eso encaja aqui, asi que se sustituyo por esto.
name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar
        run: mvn -B package --file pom.xml
      - name: Publicar el jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: target/*.jar
