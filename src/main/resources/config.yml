# Periodos de las tareas en ticks de Minecraft (20 ticks = 1 segundo).
ticker:
  # Las entidades demoníacas activas se actualizan una vez por segundo.
  entity: 20
  # Se limita internamente a un minimo de 5 para proteger el hilo principal.
  armor: 5

# Clásico es vanilla puro. Aunque ``clasico_nether`` tenga ambiente NETHER,
# no debe convertir spawns naturales en entidades de DemonicExpansion.
entity-replacements:
  excluded-worlds:
    - clasico
    - clasico_nether
    - clasico_the_end

# Debug Mode
debug: false

# Conservado por compatibilidad de configuración; las descargas automáticas están deshabilitadas.
auto-update: false
